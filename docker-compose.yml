version: "3.9"

services:
  # Base de données : Supabase (Postgres géré), plus de conteneur MySQL local.
  # Renseigner DATABASE_URL / SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY dans backend/.env
  # (voir backend/.env.example).
  backend:
    build: ./backend
    container_name: pnda_backend
    restart: always
    ports:
      - "4001:4000"
    env_file:
      - ./backend/.env
